<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBot AI – Intelligent Virtual Assistant</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

    <div class="container">
        <header class="header">
            <img src="image/robot.png">
            <div class="botInfo">
                <h1>SmartBot AI</h1>
                <p>Online | I'm AI Assistant</p>
            </div>
        </header>

        <main class="chatMessage" id="chatMessage">
            <div class="message">
                <div class="icon">🤖</div>
                <div class="content">
                    <p>Hello! 👋 Welcome to SmartBot AI.</p>
                    <p>How can I help you today.</p>
                </div>
            </div>
        </main>


        <form class="formChat" id="formChat">
            <input type="text" id="userInput" placeholder="Ask me Anything..." autocomplete="off" required>

            <button type="submit" id="sendBtn">Send ➤</button>
        </form>


        <footer class="footer">
            Powered by SmartBot AI
        </footer>
    </div>
    
</body>
</html>
